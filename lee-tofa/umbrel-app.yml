manifestVersion: 1
id: lee-tofa
storage:
  dataRoot: data
folderAccess:
  - id: videos
    name: Videos
    note: Media for your Tofa libraries, your Home/Videos folder unless you pick another. Add /media as a library in Tofa. Access is read-only to protect the original files.
    mounts:
      - service: server
        targetPath: /media
        readOnly: true
  - id: network-media
    name: Network Media
    note: Select a folder on a network drive (add the drive in Files → Network first), then add /network-media as a library in Tofa. Access is read-only to protect the original files.
    mounts:
      - service: server
        targetPath: /network-media
        readOnly: true
name: Tofa
tagline: Your personal media server
category: media
version: "0.13.0"
port: 33333
description: >-
  Tofa streams your own movie and TV library, with hardware-accelerated
  transcoding on the Intel integrated GPU. Its database, backups, cache and
  logs are kept in the app's storage. Your umbrelOS Home/Videos folder is
  mounted read-only at /media, and a folder on a network drive can be added
  at /network-media from the app's settings. After installing, open the app
  to link the server to your Tofa account.
developer: TofaTV
website: https://tofa.tv
submitter: lee-antics
support: https://docs.tofa.tv
dependencies: []
path: ""
defaultUsername: ""
defaultPassword: ""
icon: https://app.tofa.tv/logo.svg
repo: https://github.com/lee-antics/lee-umbrel-apps
gallery: []
permissions:
  - GPU
# Tofa serves HTTPS on its own port with a *.connect.tofa.tv certificate,
# which apps on the home network require. Without this, umbrelOS answers
# HTTPS on the port with its own certificate and apps fall back to the relay.
nativeTlsHostnameSuffixes:
  - connect.tofa.tv
releaseNotes: >-
  Tofa 0.13.0:
    New:
      - Live TV: build channels from your library, or add tuners and playlists, with a guide and recordings.
      - A new setup takes you from your first library to watching on your TV, and can bring your libraries, history, watchlists, collections and people from Plex, Jellyfin or Emby.
      - Requests work without other apps, and each person can have their own request setting.
      - Allow video conversion in Settings > Transcoding turns video conversion off for everyone, and each person can have their own "Can convert video" setting.
      - Mixed libraries hold movies and shows together. Browse can be organised by type or by library.
      - Limit each profile to selected libraries, and add Recently Added rows per library.
      - Search splits results into shelves per library when you have several of a type.
      - Delete generated previews for one library or the whole server.
      - Hide paths and titles in Support bundles.
      - A new sync API lets your own tools read and update watch state.
    Changed:
      - On update, we look for intros and credits across your libraries in the background, including libraries with previews off. On Network mounts with previews off, this only happens on playback or when you start it.
      - Libraries follow symlinks outside their folders by default. You can turn this off in Library options.
      - A folder can no longer belong to two libraries, which used to leave the second one empty.
      - If you were here before this release, we offer you the new setup once: owners the full setup, everyone else their personal part. It starts from your current settings, and you can say no thanks.
    Removed:
      - The Save watch history switch. We now record every play on your server. You can still delete your history.
      - `POST /api/v1/media/refresh`. Use the bulk refresh action.
    Fixed:
      - Playback setting changes are no longer lost when apps sync their defaults.
      - Network mounts are no longer re-read again and again for subtitle checks, and complete metadata no longer refreshes every five minutes.
      - Episode details now pick up catalog corrections.
      - Jellyfin 12 sign-in and sync work again, and watched marks sent back to Jellyfin now find more episodes.
      - Plex and Jellyfin imports match both halves of a two-episode file.
      - A profile locked or removed on another device now returns you to Who's watching instead of getting stuck.
      - Remote access says direct only after an outside check succeeds.
      - Storage usage and low-space alerts now read the right disk on network mounts.


  Full release notes can be found at https://docs.tofa.tv/whats-new.html#server-0-13-0
