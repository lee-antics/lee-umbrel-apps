services:
  server:
    # Pinned to an exact release; .github/workflows/update-apps.yml bumps it.
    image: ghcr.io/tofatv/tofa:0.13.1@sha256:9c99b779bb0b4f64990dec9e98903193c43d6c42d20eb0feaccaea752aa83a1c
    init: true
    restart: unless-stopped
    # Tofa recommends 512m for its embedded database (Docker's default is 64m).
    shm_size: 512m
    # Tofa's docs call for host networking (local discovery).
    network_mode: host
    # GPU access (hardware transcoding) comes from the GPU permission in
    # umbrel-app.yml; umbrelOS adds /dev/dri and its groups at install.
    volumes:
      - ${APP_DATA_DIR}/data:/data
      - ${UMBREL_ROOT}/home/Videos:/media:ro
