name: Update apps

on:
  schedule:
    - cron: "0 18 * * *" # daily, 5am Sydney (AEDT)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for newer releases
        id: bump
        run: |
          python3 .github/scripts/update_apps.py > bumped.txt
          echo "message=$(paste -sd, bumped.txt | sed 's/,/, /g')" >> "$GITHUB_OUTPUT"
          rm bumped.txt

      - name: Commit the bump
        if: steps.bump.outputs.message != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "${{ steps.bump.outputs.message }}"
          git push
